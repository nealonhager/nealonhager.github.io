# Deploys the Vite-built site to GitHub Pages via artifact upload.
#
# REQUIRED GITHUB SETTING: Repository Settings → Pages → Build and deployment
# must be set to Source: "GitHub Actions" (not "Deploy from a branch").
# If set to branch deploy, GitHub ignores the artifact and serves raw source.
name: Deploy GitHub Pages

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: github-pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            GITHUB_REPOSITORY: ${{ github.repository }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Configure Pages
              uses: actions/configure-pages@v5

            - name: Install dependencies
              run: npm ci

            - name: Build site
              run: npm run build

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
